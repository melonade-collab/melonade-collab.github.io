<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Nunito', 'Trebuchet MS', sans-serif;
  background: linear-gradient(160deg, #FFE4F0 0%, #EDE4FF 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 16px 48px;
}
.back {
  align-self: flex-start;
  text-decoration: none;
  color: #D63384;
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 12px;
  padding: 6px 16px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.back:hover { background: #FFF0F8; }
h1 {
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 900;
  color: #D63384;
  text-shadow: 2px 2px 0 #FFB3CC;
  margin-bottom: 14px;
}
.panda-wrap {
  background: white;
  border-radius: 28px;
  box-shadow: 0 8px 30px rgba(200,100,200,0.18);
  padding: 12px 12px 4px;
  margin-bottom: 18px;
  width: min(290px, 88vw);
}
#pandaSvg { width: 100%; height: auto; display: block; }
.section-label {
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: 4px;
  color: #C0A0C0;
  margin-bottom: 9px;
  text-align: center;
}
.mode-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-width: 320px;
  width: 100%;
  margin-bottom: 20px;
}
.mode-btn {
  padding: 10px 8px;
  border-radius: 14px;
  border: 3px solid transparent;
  background: white;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: #8B6BAE;
  box-shadow: 0 2px 10px rgba(180,100,200,0.1);
  transition: all 0.14s;
}
.mode-btn:hover { transform: scale(1.04); }
.mode-btn.active { border-color: #D63384; background: #FFF0F8; color: #D63384; }
.outfit-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 320px;
  width: 100%;
  margin-bottom: 18px;
}
.outfit-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 4px;
  border-radius: 14px;
  border: 3px solid transparent;
  background: white;
  cursor: pointer;
  transition: all 0.14s;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.68rem;
  color: #8B6BAE;
  box-shadow: 0 2px 10px rgba(180,100,200,0.1);
}
.outfit-btn .icon { font-size: 1.45rem; line-height: 1; }
.outfit-btn:hover { transform: scale(1.06); }
.outfit-btn.active { border-color: #D63384; background: #FFF0F8; color: #D63384; }
.acc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  max-width: 320px;
  width: 100%;
  margin-bottom: 18px;
}
.acc-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 16px;
  border: 3px solid transparent;
  background: white;
  cursor: pointer;
  transition: all 0.14s;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.76rem;
  color: #8B6BAE;
  box-shadow: 0 2px 10px rgba(180,100,200,0.1);
}
.acc-btn .icon { font-size: 1.75rem; line-height: 1; }
.acc-btn:hover { transform: scale(1.06); }
.acc-btn.active { border-color: #D63384; background: #FFF0F8; color: #D63384; }
.reset-btn {
  padding: 10px 28px;
  border-radius: 14px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  background: #F3E8FF;
  color: #7C3AED;
  box-shadow: 0 2px 10px rgba(124,58,237,0.15);
  transition: transform 0.1s;
}
.reset-btn:active { transform: scale(0.94); }
</style>
</head>

<div class="section-label">STYLE</div>

  <button class="mode-btn"        id="mbtn-minecraft" onclick="setMode('minecraft')">⛏️ Minecraft</button>
  <button class="mode-btn"        id="mbtn-roblox"    onclick="setMode('roblox')">🧱 Roblox</button>
  <button class="mode-btn"        id="mbtn-anime"     onclick="setMode('anime')">✨ Anime</button>
</div>

<div class="section-label">OUTFIT</div>
<div class="outfit-grid">
  <button class="outfit-btn active" id="obtn-none"       onclick="setOutfit('none',this)">      <span class="icon">🐼</span><span>None</span></button>
  <button class="outfit-btn"        id="obtn-pink"       onclick="setOutfit('pink',this)">      <span class="icon">💗</span><span>Pink</span></button>
  <button class="outfit-btn"        id="obtn-blue"       onclick="setOutfit('blue',this)">      <span class="icon">⭐</span><span>Stars</span></button>
  <button class="outfit-btn"        id="obtn-purple"     onclick="setOutfit('purple',this)">    <span class="icon">👸</span><span>Princess</span></button>
  <button class="outfit-btn"        id="obtn-strawberry" onclick="setOutfit('strawberry',this)"><span class="icon">🍓</span><span>Berry</span></button>
  <button class="outfit-btn"        id="obtn-rainbow"    onclick="setOutfit('rainbow',this)">   <span class="icon">🌈</span><span>Rainbow</span></button>

</div>

<div class="acc-grid">
  <button class="acc-btn" id="btn-blush"      onclick="toggle('blush')">      <span class="icon">🌸</span><span>Blush</span></button>
  <button class="acc-btn" id="btn-glasses"    onclick="toggle('glasses')">    <span class="icon">👓</span><span>Glasses</span></button>
  <button class="acc-btn" id="btn-sunglasses" onclick="toggle('sunglasses')"> <span class="icon">🕶️</span><span>Sunnies</span></button>
  <button class="acc-btn" id="btn-crown"      onclick="toggle('crown')">      <span class="icon">👑</span><span>Crown</span></button>
  <button class="acc-btn" id="btn-tiara"      onclick="toggle('tiara')">      <span class="icon">✨</span><span>Tiara</span></button>
  <button class="acc-btn" id="btn-bow"        onclick="toggle('bow')">        <span class="icon">🎀</span><span>Bow</span></button>
  <button class="acc-btn" id="btn-flower"     onclick="toggle('flower')">     <span class="icon">🌺</span><span>Flower</span></button>
  <button class="acc-btn" id="btn-hat"        onclick="toggle('hat')">        <span class="icon">🎉</span><span>Party Hat</span></button>
  <button class="acc-btn" id="btn-bunny"      onclick="toggle('bunny')">      <span class="icon">🐰</span><span>Bunny Ears</span></button>
  <button class="acc-btn" id="btn-wings"      onclick="toggle('wings')">      <span class="icon">🕊️</span><span>Wings</span></button>
  <button class="acc-btn" id="btn-necklace"   onclick="toggle('necklace')">   <span class="icon">📿</span><span>Necklace</span></button>
  <button class="acc-btn" id="btn-scarf"      onclick="toggle('scarf')">      <span class="icon">🧣</span><span>Scarf</span></button>
  <button class="acc-btn" id="btn-bowtie"     onclick="toggle('bowtie')">     <span class="icon">🎗️</span><span>Bow Tie</span></button>
  <button class="acc-btn" id="btn-wand"       onclick="toggle('wand')">       <span class="icon">⭐</span><span>Star Wand</span></button>
</div>

<button class="reset-btn" onclick="resetAll()">✕ Reset All</button>

<script>
const ACCS    = ['blush','glasses','sunglasses','crown','tiara','bow','flower','hat','bunny','wings','necklace','scarf','bowtie','wand'];
const OUTFITS = ['pink','blue','purple','strawberry','rainbow','mint'];
const MODES   = ['kawaii','minecraft','roblox','anime'];
const PFXMAP  = { kawaii:'', minecraft:'mc-', roblox:'rb-', anime:'an-' };

let currentMode  = 'kawaii';
let activeOutfit = 'none';
const activeAccs = new Set();

function pfx() { return PFXMAP[currentMode]; }

function setMode(m) {
  currentMode = m;
  MODES.forEach(mode => {
    document.getElementById('mode-' + mode).style.display = (mode === m) ? '' : 'none';
    document.getElementById('mbtn-' + mode).classList.toggle('active', mode === m);
  });
  const p = pfx();
  OUTFITS.forEach(o => {
    const el = document.getElementById(p + 'outfit-' + o);
    if (el) el.style.display = (activeOutfit === o) ? '' : 'none';
  });
  ACCS.forEach(id => {
    const el = document.getElementById(p + 'acc-' + id);
    if (el) el.style.display = activeAccs.has(id) ? '' : 'none';
  });
}

function toggle(id) {
  const el  = document.getElementById(pfx() + 'acc-' + id);
  const btn = document.getElementById('btn-' + id);
  const show = el.style.display === 'none';
  el.style.display = show ? '' : 'none';
  btn.classList.toggle('active', show);
  if (show) activeAccs.add(id); else activeAccs.delete(id);
}

function setOutfit(name, btn) {
  activeOutfit = name;
  const p = pfx();
  OUTFITS.forEach(o => {
    const el = document.getElementById(p + 'outfit-' + o);
    if (el) el.style.display = 'none';
  });
  document.querySelectorAll('.outfit-btn').forEach(b => b.classList.remove('active'));
  if (name !== 'none') {
    const el = document.getElementById(p + 'outfit-' + name);
    if (el) el.style.display = '';
  }
  btn.classList.add('active');
}

function resetAll() {
  activeAccs.clear();
  activeOutfit = 'none';
  Object.values(PFXMAP).forEach(p => {
    ACCS.forEach(id => {
      const el = document.getElementById(p + 'acc-' + id);
      if (el) el.style.display = 'none';
    });
    OUTFITS.forEach(o => {
      const el = document.getElementById(p + 'outfit-' + o);
      if (el) el.style.display = 'none';
    });
  });
  document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.outfit-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('obtn-none').classList.add('active');
}
</script>
